<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>

    <p class="heading">Rock Paper Scissors</p>
    <button class="choiceBtn rockBtn"><img class = "choiceImg" src="./Icons/rock-emoji.png" alt="Rock" /></button>
    <button class="choiceBtn paperBtn"><img class = "choiceImg" src="./Icons/paper-emoji.png" alt="Paper" /></button>
    <button class="choiceBtn scissorsBtn"><img class = "choiceImg" src="./Icons/scissors-emoji.png" alt="Scissors" /></button>
    <p class="result"></p>
    <p class="move"></p>
    <p class="score"></p>
    <button class="resetBtn" onclick="resetScore()">Reset Score</button>
    <button class="autoPlayBtn" onclick="autoPlay()">Auto Play</button>

    <script src="./script.js"></script>
  </body>
</html>
